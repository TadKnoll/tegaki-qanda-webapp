<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>手書き 一問一答 チェック</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>✍️ 手書き 一問一答チェック</h1>
    <nav id="tabs" class="tabs"></nav>
  </header>

  <main>
    <div class="qnum" id="qnum">問題 1</div>
    <div class="question" id="question-text">…</div>

    <div class="cells" id="cells"></div>

    <p class="hint" id="hint">マスは左から順に1字ずつ書きましょう。余ったマスは空のままでOK。</p>

    <p class="data-note" id="data-note" hidden></p>

    <div class="controls">
      <button id="undo-btn" class="btn">この1字を消す</button>
      <button id="clear-btn" class="btn">全部消す</button>
      <button id="grade-btn" class="btn primary">採点する</button>
    </div>

    <div id="result"></div>

    <div class="nav">
      <button id="prev-btn" class="btn">◀ 前へ</button>
      <button id="next-btn" class="btn">次へ ▶</button>
    </div>

    <div id="collect-bar" class="collect" hidden>
      <span id="collect-count"></span>
      <button id="collect-dl" class="btn">ダウンロード</button>
    </div>
    <p class="collect-hint">採点後、正しく書けたと思うマスを「学習用に保存」できます（◯の字はまとめて保存、△・×でも「正しく書けた → 保存」ボタン、自己採点で「○ あってる」を選んだ字も自動保存）。ためたデータをダウンロードして、手書き認識の再学習に使えます。</p>
  </main>

  <script src="vendor/kanji-canvas.min.js"></script>
  <script src="vendor/ref-patterns.js"></script>
  <script src="vendor/onnx/ort.min.js"></script>
  <script src="vendor/onnx/labels.js"></script>
  <script src="js/cnn.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/questions-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
